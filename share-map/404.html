<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang mở Share MAP...</title>
</head>
<body>
  <p>Đang chuyển tới phiên chia sẻ...</p>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    const code = parts.length > 1 && parts[0] === "share-map"
      ? parts[1]
      : "";

    if (/^[A-Za-z0-9]{6}$/.test(code)) {
      location.replace("/share-map/?code=" + encodeURIComponent(code));
    } else {
      location.replace("/share-map/");
    }
  </script>
</body>
</html>
