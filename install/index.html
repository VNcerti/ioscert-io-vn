<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1,
            maximum-scale=1,
            viewport-fit=cover">

<meta name="theme-color" content="#f7f9fc">

<title>ESign</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
    background: #f7f9fc;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;

    color: #1d1d1f;

    background:
        linear-gradient(
            145deg,
            #f9fbff 0%,
            #f5f8fd 45%,
            #f9f9fc 100%
        );

    -webkit-font-smoothing: antialiased;

    overflow-x: hidden;
}


/* =========================================================
   SOFT APPLE BACKGROUND LIGHT
========================================================= */

body::before {
    content: "";

    position: fixed;

    width: 430px;
    height: 430px;

    top: -220px;
    left: -160px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,122,255,.13) 0%,
            rgba(0,122,255,.05) 38%,
            transparent 72%
        );

    filter: blur(20px);

    pointer-events: none;
}


body::after {
    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    right: -180px;
    bottom: -180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(175,82,222,.10) 0%,
            rgba(88,86,214,.04) 42%,
            transparent 72%
        );

    filter: blur(25px);

    pointer-events: none;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom))
        18px;
}


/* =========================================================
   APPLE GLASS CARD
========================================================= */

.card {

    position: relative;

    width: 100%;
    max-width: 430px;

    padding: 34px 23px 28px;

    border-radius: 32px;

    /*
     * Glass sáng
     */

    background:
        rgba(255,255,255,.68);

    border:
        1px solid rgba(255,255,255,.90);

    backdrop-filter:
        blur(28px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(180%);

    box-shadow:

        0 30px 70px
        rgba(31,38,135,.08),

        0 8px 25px
        rgba(0,0,0,.035),

        inset 0 1px 0
        rgba(255,255,255,.95);

    overflow: hidden;

    animation:
        cardIn .55s
        cubic-bezier(.22,.8,.22,1);
}


/*
 * Kính phản sáng phía trên
 */

.card::before {

    content: "";

    position: absolute;

    top: -90px;
    left: 10%;

    width: 80%;
    height: 150px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.9),
            transparent 70%
        );

    filter: blur(12px);

    pointer-events: none;
}


/*
 * Đường highlight rất nhẹ
 */

.card::after {

    content: "";

    position: absolute;

    left: 8%;
    right: 8%;

    top: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    pointer-events: none;
}


@keyframes cardIn {

    from {
        opacity: 0;

        transform:
            translateY(18px)
            scale(.985);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   APP ICON
========================================================= */

.icon-wrapper {

    position: relative;

    width: 104px;
    height: 104px;

    margin: 0 auto 22px;

    padding: 5px;

    border-radius: 27px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:

        0 16px 35px
        rgba(0,0,0,.10),

        0 4px 12px
        rgba(0,122,255,.06),

        inset 0 1px 0
        rgba(255,255,255,1);
}


/*
 * Glow xung quanh icon
 */

.icon-wrapper::before {

    content: "";

    position: absolute;

    inset: -8px;

    border-radius: 32px;

    background:
        radial-gradient(
            circle,
            rgba(0,122,255,.12),
            transparent 68%
        );

    filter: blur(12px);

    z-index: -1;
}


.app-icon {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 22px;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.25);
}


/* =========================================================
   TITLE
========================================================= */

.title {

    margin: 0;

    text-align: center;

    color: #1d1d1f;

    font-size: 30px;

    line-height: 1.12;

    font-weight: 700;

    letter-spacing: -.7px;
}


.version {

    margin-top: 8px;

    text-align: center;

    color: #86868b;

    font-size: 15px;

    font-weight: 500;

    letter-spacing: -.1px;
}


/* =========================================================
   CERTIFICATE GLASS BOX
========================================================= */

.certificate-box {

    margin-top: 26px;

    padding: 17px 16px;

    border-radius: 19px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid rgba(255,255,255,.82);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.95),

        0 4px 14px
        rgba(0,0,0,.025);

    backdrop-filter:
        blur(18px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(160%);
}


.label {

    margin-bottom: 7px;

    text-align: center;

    color: #9898a0;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.15px;
}


.certificate {

    text-align: center;

    color: #2c2c2e;

    font-size: 14px;

    line-height: 1.45;

    font-weight: 600;
}


/* =========================================================
   INSTALL BUTTON
========================================================= */

.install {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    width: 100%;

    margin-top: 21px;

    padding: 16px 20px;

    border-radius: 16px;

    background:
        linear-gradient(
            180deg,
            #0a84ff 0%,
            #007aff 100%
        );

    color: white;

    text-decoration: none;

    font-size: 17px;

    font-weight: 600;

    letter-spacing: -.1px;

    box-shadow:

        0 9px 22px
        rgba(0,122,255,.22),

        inset 0 1px 0
        rgba(255,255,255,.32);

    overflow: hidden;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


/*
 * Hiệu ứng kính chạy ngang nút
 */

.install::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            105deg,
            transparent,
            rgba(255,255,255,.30),
            transparent
        );

    transform: skewX(-20deg);

    transition:
        left .65s ease;
}


.install:hover::before {

    left: 145%;
}


.install:active {

    transform: scale(.975);

    box-shadow:
        0 5px 14px
        rgba(0,122,255,.18);
}


/* =========================================================
   DOWNLOAD ICON
========================================================= */

.download-icon {

    position: relative;

    width: 18px;
    height: 18px;

    display: inline-flex;

    align-items: center;
    justify-content: center;
}


.download-icon::before {

    content: "";

    width: 7px;
    height: 9px;

    border-left:
        2px solid white;

    border-bottom:
        2px solid white;

    transform:
        rotate(-45deg)
        translateY(-2px);
}


.download-icon::after {

    content: "";

    position: absolute;

    bottom: 0;

    width: 14px;
    height: 2px;

    border-radius: 2px;

    background: white;
}


/* =========================================================
   NOTE
========================================================= */

.note {

    margin-top: 17px;

    text-align: center;

    color: #8e8e93;

    font-size: 12.5px;

    line-height: 1.55;
}


.safari-note {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    margin-top: 12px;

    padding: 7px 11px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid rgba(255,255,255,.78);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.9);

    color: #85858b;

    font-size: 11px;

    font-weight: 600;
}


.safari-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #34c759;

    box-shadow:
        0 0 0 3px
        rgba(52,199,89,.10);
}


/* =========================================================
   ERROR
========================================================= */

.error {

    text-align: center;

    padding: 30px 10px;
}


.error-icon {

    width: 60px;
    height: 60px;

    margin: 0 auto 15px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        rgba(255,59,48,.08);

    color: #ff3b30;

    font-size: 24px;

    font-weight: 700;
}


.error h2 {

    margin: 0;

    color: #1d1d1f;

    font-size: 21px;
}


.error p {

    margin: 9px 0 0;

    color: #86868b;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width: 360px) {

    .card {
        padding: 29px 18px 24px;
        border-radius: 28px;
    }

    .icon-wrapper {
        width: 92px;
        height: 92px;
        border-radius: 24px;
    }

    .app-icon {
        border-radius: 20px;
    }

    .title {
        font-size: 27px;
    }

}

</style>

<script>

/* =========================================================
   IOSCERT INSTALL LOGIC
========================================================= */

(function () {


    /*
     * Đọc:
     *
     * ?app=esign-hebei-rongkai-network-technology-co-ltd
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const app =
        params.get("app");


    /*
     * Không có app
     */

    if (!app) {

        showError(
            "Liên kết cài đặt không hợp lệ."
        );

        return;

    }


    /*
     * Tự động tạo:
     *
     * /install/{app}/manifest.plist
     */

    const manifestURL =

        window.location.origin +

        "/install/" +

        encodeURIComponent(app) +

        "/manifest.plist";


    /*
     * Tạo itms-services
     */

    const installURL =

        "itms-services://?action=download-manifest&url=" +

        encodeURIComponent(
            manifestURL
        );


    /*
     * Gắn vào nút
     */

    document
        .getElementById("install")
        .href = installURL;


    /*
     * Tên certificate
     */

    const certificateNames = {


        "esign-hebei-rongkai-network-technology-co-ltd":

            "Hebei Rongkai Network Technology Co., Ltd",


        "esign-ola-city-global-limited":

            "Ola City Global Limited",


        "esign-abc-company":

            "ABC Company"

    };


    let certificate =
        certificateNames[app];


    /*
     * Nếu chưa khai báo:
     * tự tạo tên từ slug
     */

    if (!certificate) {

        certificate =

            app

                .replace(
                    /^esign-/,
                    ""
                )

                .replace(
                    /-/g,
                    " "
                )

                .replace(
                    /\b\w/g,
                    function (char) {

                        return char.toUpperCase();

                    }
                );

    }


    /*
     * Hiển thị
     */

    document
        .getElementById("certificate")
        .textContent =
        certificate;


    /*
     * Title trình duyệt
     */

    document.title =
        "ESign 5.0.2";


    /*
     * Error
     */

    function showError(message) {

        document
            .getElementById("card")
            .innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        !
                    </div>

                    <h2>
                        Không thể tải ứng dụng
                    </h2>

                    <p>
                        ${message}
                    </p>

                </div>

            `;

    }


})();

</script>
