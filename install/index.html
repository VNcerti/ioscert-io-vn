<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#f7f9fc">

<title>ESign</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
    background: #f7f9fc;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;

    color: #1d1d1f;

    background:
        linear-gradient(
            145deg,
            #f9fbff 0%,
            #f5f8fd 45%,
            #f9f9fc 100%
        );

    -webkit-font-smoothing: antialiased;

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND LIGHT
========================================================= */

body::before {
    content: "";

    position: fixed;

    width: 400px;
    height: 400px;

    top: -200px;
    left: -150px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,122,255,.12) 0%,
            rgba(0,122,255,.04) 40%,
            transparent 72%
        );

    filter: blur(20px);

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;

    width: 390px;
    height: 390px;

    right: -180px;
    bottom: -180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(175,82,222,.09) 0%,
            rgba(88,86,214,.03) 42%,
            transparent 72%
        );

    filter: blur(25px);

    pointer-events: none;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(18px, env(safe-area-inset-bottom))
        16px;
}


/* =========================================================
   CARD — NHỎ HƠN
========================================================= */

.card {

    position: relative;

    width: 100%;
    max-width: 390px;

    padding: 27px 20px 22px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.70);

    border:
        1px solid rgba(255,255,255,.90);

    backdrop-filter:
        blur(28px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(180%);

    box-shadow:

        0 25px 55px
        rgba(31,38,135,.075),

        0 7px 20px
        rgba(0,0,0,.035),

        inset 0 1px 0
        rgba(255,255,255,.95);

    overflow: hidden;

    animation:
        cardIn .55s
        cubic-bezier(.22,.8,.22,1);
}


.card::before {

    content: "";

    position: absolute;

    top: -80px;
    left: 10%;

    width: 80%;
    height: 130px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.9),
            transparent 70%
        );

    filter: blur(12px);

    pointer-events: none;
}


.card::after {

    content: "";

    position: absolute;

    left: 8%;
    right: 8%;

    top: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    pointer-events: none;
}


@keyframes cardIn {

    from {
        opacity: 0;

        transform:
            translateY(15px)
            scale(.985);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   APP ICON — NHỎ HƠN
========================================================= */

.icon-wrapper {

    position: relative;

    width: 88px;
    height: 88px;

    margin: 0 auto 17px;

    padding: 4px;

    border-radius: 23px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:

        0 13px 28px
        rgba(0,0,0,.09),

        0 4px 10px
        rgba(0,122,255,.05),

        inset 0 1px 0
        rgba(255,255,255,1);
}


.icon-wrapper::before {

    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 28px;

    background:
        radial-gradient(
            circle,
            rgba(0,122,255,.10),
            transparent 68%
        );

    filter: blur(10px);

    z-index: -1;
}


.app-icon {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 19px;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.25);
}


/* =========================================================
   TITLE
========================================================= */

.title {

    margin: 0;

    text-align: center;

    color: #1d1d1f;

    font-size: 27px;

    line-height: 1.12;

    font-weight: 700;

    letter-spacing: -.6px;
}


.version {

    margin-top: 6px;

    text-align: center;

    color: #86868b;

    font-size: 14px;

    font-weight: 500;
}


/* =========================================================
   CERTIFICATE
========================================================= */

.certificate-box {

    margin-top: 20px;

    padding: 14px 14px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid rgba(255,255,255,.82);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.95),

        0 4px 12px
        rgba(0,0,0,.025);

    backdrop-filter:
        blur(18px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(18px)
        saturate(160%);
}


.label {

    margin-bottom: 6px;

    text-align: center;

    color: #9898a0;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.1px;
}


.certificate {

    text-align: center;

    color: #2c2c2e;

    font-size: 13px;

    line-height: 1.4;

    font-weight: 600;
}


/* =========================================================
   INSTALL BUTTON
========================================================= */

.install {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    width: 100%;

    margin-top: 17px;

    padding: 14px 18px;

    border-radius: 14px;

    background:
        linear-gradient(
            180deg,
            #0a84ff 0%,
            #007aff 100%
        );

    color: white;

    text-decoration: none;

    font-size: 16px;

    font-weight: 600;

    letter-spacing: -.1px;

    box-shadow:

        0 8px 18px
        rgba(0,122,255,.20),

        inset 0 1px 0
        rgba(255,255,255,.32);

    overflow: hidden;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.install::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            105deg,
            transparent,
            rgba(255,255,255,.30),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .65s ease;
}


.install:hover::before {
    left: 145%;
}


.install:active {

    transform: scale(.975);

    box-shadow:
        0 4px 12px
        rgba(0,122,255,.16);
}


/* =========================================================
   DOWNLOAD ICON
========================================================= */

.download-icon {

    position: relative;

    width: 17px;
    height: 17px;

    display: inline-flex;

    align-items: center;
    justify-content: center;
}


.download-icon::before {

    content: "";

    width: 7px;
    height: 8px;

    border-left:
        2px solid white;

    border-bottom:
        2px solid white;

    transform:
        rotate(-45deg)
        translateY(-2px);
}


.download-icon::after {

    content: "";

    position: absolute;

    bottom: 0;

    width: 13px;
    height: 2px;

    border-radius: 2px;

    background: white;
}


/* =========================================================
   NOTE
========================================================= */

.note {

    margin-top: 14px;

    text-align: center;

    color: #8e8e93;

    font-size: 11.5px;

    line-height: 1.5;
}


.safari-note {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-top: 9px;

    padding: 6px 10px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.58);

    border:
        1px solid rgba(255,255,255,.78);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.9);

    color: #85858b;

    font-size: 10px;

    font-weight: 600;
}


.safari-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #34c759;

    box-shadow:
        0 0 0 3px
        rgba(52,199,89,.09);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 15px;

    text-align: center;

    color: #a1a1a6;

    font-size: 10.5px;

    font-weight: 500;

    letter-spacing: .1px;

    opacity: .9;
}


/* =========================================================
   ERROR
========================================================= */

.error {

    text-align: center;

    padding: 25px 8px;
}


.error-icon {

    width: 54px;
    height: 54px;

    margin: 0 auto 13px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        rgba(255,59,48,.08);

    color: #ff3b30;

    font-size: 22px;

    font-weight: 700;
}


.error h2 {

    margin: 0;

    color: #1d1d1f;

    font-size: 20px;
}


.error p {

    margin: 8px 0 0;

    color: #86868b;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width: 360px) {

    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .card {
        padding: 24px 17px 20px;
        border-radius: 25px;
    }

    .icon-wrapper {
        width: 80px;
        height: 80px;
        border-radius: 21px;
        margin-bottom: 15px;
    }

    .app-icon {
        border-radius: 17px;
    }

    .title {
        font-size: 25px;
    }

    .certificate-box {
        margin-top: 18px;
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .card {
        animation: none;
    }

    .install,
    .install::before {
        transition: none;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- MAIN CARD -->

    <div class="card" id="card">


        <!-- ESign Logo -->

        <div class="icon-wrapper">

            <img
                class="app-icon"
                src="https://vsacheat.com/img/esign.png"
                alt="ESign">

        </div>


        <!-- APP NAME -->

        <h1
            class="title"
            id="appName">

            ESign

        </h1>


        <!-- VERSION -->

        <div
            class="version"
            id="version">

            Version 5.0.2

        </div>


        <!-- CERTIFICATE -->

        <div class="certificate-box">

            <div class="label">

                CHỨNG CHỈ KÝ

            </div>


            <div
                class="certificate"
                id="certificate">

                Đang tải...

            </div>

        </div>


        <!-- INSTALL BUTTON -->

        <a
            id="install"
            class="install"
            href="#">

            <span class="download-icon"></span>

            Cài đặt ESign

        </a>


        <!-- NOTE -->

        <div class="note">

            Nhấn nút bên trên để bắt đầu cài đặt ESign.

            <br>

            <span class="safari-note">

                <span class="safari-dot"></span>

                Khuyến nghị sử dụng Safari

            </span>

        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 - CHUNGCHIP12.COM

    </div>


</div>



<script>

/* =========================================================
   IOSCERT INSTALL LOGIC
========================================================= */

(function () {


    /*
     * Đọc tham số:
     *
     * ?app=esign-hebei-rongkai-network-technology-co-ltd
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const app =
        params.get("app");


    /*
     * Không có app
     */

    if (!app) {

        showError(
            "Liên kết cài đặt không hợp lệ."
        );

        return;

    }


    /*
     * Tự động tạo đường dẫn:
     *
     * /install/{app}/manifest.plist
     */

    const manifestURL =

        window.location.origin +

        "/install/" +

        encodeURIComponent(app) +

        "/manifest.plist";


    /*
     * Tạo link cài đặt iOS
     */

    const installURL =

        "itms-services://?action=download-manifest&url=" +

        encodeURIComponent(
            manifestURL
        );


    /*
     * Gắn link vào nút cài đặt
     */

    document
        .getElementById("install")
        .href = installURL;


    /*
     * Tên chứng chỉ
     */

    const certificateNames = {


        "esign-hebei-rongkai-network-technology-co-ltd":

            "Hebei Rongkai Network Technology Co., Ltd",


        "esign-ola-city-global-limited":

            "Ola City Global Limited",


        "esign-abc-company":

            "ABC Company"

    };


    let certificate =
        certificateNames[app];


    /*
     * Nếu chưa khai báo:
     * tự chuyển slug thành tên dễ đọc
     */

    if (!certificate) {

        certificate =

            app

                .replace(
                    /^esign-/,
                    ""
                )

                .replace(
                    /-/g,
                    " "
                )

                .replace(
                    /\b\w/g,
                    function (char) {

                        return char.toUpperCase();

                    }
                );

    }


    /*
     * Hiển thị certificate
     */

    document
        .getElementById("certificate")
        .textContent =
        certificate;


    /*
     * Title
     */

    document.title =
        "ESign 5.0.2";


    /*
     * Error
     */

    function showError(message) {

        document
            .getElementById("card")
            .innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        !
                    </div>

                    <h2>
                        Không thể tải ứng dụng
                    </h2>

                    <p>
                        ${message}
                    </p>

                </div>

            `;

    }


})();

</script>


</body>

</html>
