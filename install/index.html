<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>ESign</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        sans-serif;

    background: #f5f5f7;
    color: #111;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));
}

.card {

    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,.96);

    border-radius: 30px;

    padding: 32px 22px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,.08);
}

.icon {

    width: 92px;
    height: 92px;

    margin: 0 auto 20px;

    border-radius: 23px;

    background: #111;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 34px;

    font-weight: 700;
}

.title {

    margin: 0;

    font-size: 28px;

    font-weight: 700;
}

.version {

    margin-top: 7px;

    color: #777;

    font-size: 15px;
}

.certificate-box {

    margin-top: 24px;

    padding: 16px;

    background: #f5f5f7;

    border-radius: 17px;
}

.label {

    font-size: 12px;

    color: #888;

    margin-bottom: 6px;
}

.certificate {

    font-size: 14px;

    font-weight: 600;

    line-height: 1.4;
}

.install {

    display: block;

    width: 100%;

    margin-top: 22px;

    padding: 16px 20px;

    border-radius: 16px;

    background: #007aff;

    color: white;

    text-decoration: none;

    font-size: 17px;

    font-weight: 600;
}

.install:active {

    transform: scale(.97);
}

.note {

    margin-top: 18px;

    color: #888;

    font-size: 13px;

    line-height: 1.5;
}

.error {

    display: none;

    color: #777;

    line-height: 1.5;
}

</style>

</head>

<body>

<div class="card" id="card">

    <div class="icon">
        E
    </div>

    <h1 class="title">
        ESign
    </h1>

    <div
        class="version"
        id="version">
        Đang tải...
    </div>

    <div class="certificate-box">

        <div class="label">
            CHỨNG CHỈ KÝ
        </div>

        <div
            class="certificate"
            id="certificate">
            Đang tải...
        </div>

    </div>

    <a
        id="install"
        class="install"
        href="#">
        Cài đặt ESign
    </a>

    <div class="note">
        Mở liên kết bằng Safari trên iPhone/iPad
        để cài đặt ứng dụng.
    </div>

    <div
        id="error"
        class="error">

        Không tìm thấy thông tin
        cài đặt cho liên kết này.

    </div>

</div>


<script>

(function () {

    /*
     * Lấy tên thư mục phía sau /install/
     *
     * Ví dụ:
     *
     * /install/esign-hebei-rongkai-network-technology-co-ltd/
     *
     * sẽ lấy được:
     *
     * esign-hebei-rongkai-network-technology-co-ltd
     */

    const path =
        window.location.pathname;

    const parts =
        path.split("/").filter(Boolean);

    const slug =
        parts[1];


    if (!slug) {

        showError();

        return;

    }


    /*
     * Manifest tương ứng
     *
     * KHÔNG cần khai báo link manifest
     * trong HTML.
     *
     * Nó tự lấy theo tên thư mục.
     */

    const manifestURL =
        window.location.origin +
        "/install/" +
        slug +
        "/manifest.plist";


    /*
     * Tạo link cài đặt iOS
     */

    const installURL =
        "itms-services://?action=download-manifest&url=" +
        encodeURIComponent(manifestURL);


    document
        .getElementById("install")
        .href = installURL;


    /*
     * Hiển thị tên chứng chỉ
     *
     * Tự chuyển:
     *
     * esign-hebei-rongkai-network-technology-co-ltd
     *
     * thành:
     *
     * Hebei Rongkai Network Technology Co., Ltd
     */

    let certificateName =
        slug
        .replace(/^esign-/, "")
        .replace(/-/g, " ");


    certificateName =
        certificateName
        .replace(/\b\w/g, function (char) {
            return char.toUpperCase();
        });


    document
        .getElementById("certificate")
        .textContent =
        certificateName;


    /*
     * Hiện version
     */

    document
        .getElementById("version")
        .textContent =
        "ESign 5.0.2";


    function showError() {

        document
            .querySelector(".icon")
            .style.display = "none";

        document
            .querySelector(".title")
            .style.display = "none";

        document
            .querySelector(".version")
            .style.display = "none";

        document
            .querySelector(".certificate-box")
            .style.display = "none";

        document
            .getElementById("install")
            .style.display = "none";

        document
            .querySelector(".note")
            .style.display = "none";

        document
            .getElementById("error")
            .style.display = "block";

    }

})();

</script>

</body>

</html>
