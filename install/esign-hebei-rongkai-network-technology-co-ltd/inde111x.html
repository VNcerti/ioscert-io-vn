<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1">

    <title>ESign 5.0.2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                sans-serif;

            background: #f5f5f7;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 28px;

            padding: 32px 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,.08);
        }

        .icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 22px;

            background: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 32px;
            font-weight: 700;
        }

        h1 {
            margin: 0;

            font-size: 28px;
        }

        .version {
            margin-top: 8px;

            color: #777;

            font-size: 15px;
        }

        .certificate {
            margin-top: 18px;

            color: #444;

            font-size: 14px;

            line-height: 1.5;
        }

        .install {
            display: block;

            margin-top: 28px;

            padding: 16px;

            border-radius: 16px;

            background: #007aff;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: 600;
        }

        .note {
            margin-top: 18px;

            color: #888;

            font-size: 13px;

            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        E
    </div>

    <h1>ESign</h1>

    <div class="version">
        Version 5.0.2
    </div>

    <div class="certificate">
        Signed by<br>
        <strong>
            Hebei Rongkai Network Technology Co., Ltd
        </strong>
    </div>

    <a
        class="install"
        href="itms-services://?action=download-manifest&url=https%3A%2F%2Fioscert.io.vn%2Finstall%2Fesign-hebei-rongkai-network-technology-co-ltd%2Fmanifest.plist"
    >
        Cài đặt ESign
    </a>

    <div class="note">
        Vui lòng mở liên kết bằng Safari trên iPhone/iPad.
    </div>

</div>

</body>
</html>
